name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Tests and privacy guard (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python >=3.10), a middle
        # version, and the newest stable release line.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Show Python version"
        run: python3 --version
      - name: "Compile Python"
        run: python3 -m compileall -q skills tests tools
      - name: "Run unit tests"
        run: python3 -m unittest discover -s tests -v
      - name: "Run repository privacy guard"
        run: python3 tools/check_repository.py
